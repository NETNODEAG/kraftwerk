# NETNODE look, after the pitch decks built as vibeables: Sofia Pro, warm page, sky accent, hairlines.
# A kraftwerk presentation template — copy of the built-in "default".
# Positions are inches on a 16:9 canvas (10 x 5.625); colors are names from `colors` or #hex.
name: NETNODE
size: 16:9
fonts:
  heading: Sofia Pro
  body: Sofia Pro
colors:
  background: "#F9F9F7"
  surface: "#FFFFFF"
  text: "#161310"
  ink2: "#52514E"
  muted: "#898781"
  accent: "#0284C7"
  onAccent: "#FFFFFF"
  line: "#E1E0D9"
default: content
layouts:
  title:
    description: "Opening slide: a big title with a line above and a footer"
    shapes:
      - kind: rect
        x: 0.54
        y: 4.72
        w: 8.92
        h: 0.012
        fill: line
    slots:
      kicker:
        kind: text
        x: 0.44
        y: 1.45
        w: 9.12
        h: 0.5
        size: 13
        color: muted
        placeholder: What this is about
      title:
        kind: text
        x: 0.44
        y: 1.95
        w: 9.12
        h: 1.75
        size: 50
        bold: true
        font: heading
        color: text
        valign: top
        required: true
        class: statement
        placeholder: Title
      subtitle:
        kind: text
        x: 0.44
        y: 3.7
        w: 9.12
        h: 0.6
        size: 16
        color: muted
        placeholder: Subtitle
      foot:
        kind: text
        x: 0.44
        y: 4.8
        w: 9.12
        h: 0.5
        size: 10
        color: muted
        placeholder: Who · where · when
  section:
    description: Divider between parts, on dark
    background: text
    shapes:
      - kind: rect
        x: 0.54
        y: 2.1
        w: 0.9
        h: 0.05
        fill: accent
    slots:
      eyebrow:
        kind: text
        x: 0.44
        y: 1.6
        w: 9.12
        h: 0.45
        size: 11
        color: accent
        class: eyebrow
        placeholder: Part 1
      title:
        kind: text
        x: 0.44
        y: 2.3
        w: 9.12
        h: 1.4
        size: 40
        bold: true
        font: heading
        color: background
        valign: top
        required: true
        class: statement
        placeholder: Section title
  content:
    description: Title and a body of text, lists or HTML
    shapes:
      - kind: rect
        x: 0.54
        y: 1.12
        w: 8.92
        h: 0.012
        fill: line
    slots:
      title:
        kind: text
        x: 0.44
        y: 0.28
        w: 7.3
        h: 0.8
        size: 24
        bold: true
        font: heading
        color: text
        valign: bottom
        placeholder: Title
      eyebrow:
        kind: text
        x: 7.74
        y: 0.28
        w: 1.82
        h: 0.8
        size: 9
        color: muted
        align: right
        valign: bottom
        class: eyebrow
        placeholder: Label
      body:
        kind: markdown
        x: 0.44
        y: 1.32
        w: 9.12
        h: 3.95
        size: 15
        color: text
        required: true
        placeholder: The slide's text, lists or a table
  statement:
    description: One sentence that carries the slide
    shapes: []
    slots:
      eyebrow:
        kind: text
        x: 0.44
        y: 1.2
        w: 9.12
        h: 0.45
        size: 11
        color: accent
        class: eyebrow
        placeholder: In one sentence
      title:
        kind: text
        x: 0.44
        y: 1.7
        w: 8.4
        h: 2.6
        size: 34
        bold: true
        font: heading
        color: text
        valign: top
        required: true
        class: statement
        placeholder: The statement
      note:
        kind: markdown
        x: 0.44
        y: 4.4
        w: 9.12
        h: 0.85
        size: 13
        color: muted
        placeholder: Why it matters
  two-column:
    description: Title with a left and a right column
    shapes:
      - kind: rect
        x: 0.54
        y: 1.12
        w: 8.92
        h: 0.012
        fill: line
    slots:
      title:
        kind: text
        x: 0.44
        y: 0.28
        w: 7.3
        h: 0.8
        size: 24
        bold: true
        font: heading
        color: text
        valign: bottom
        placeholder: Title
      eyebrow:
        kind: text
        x: 7.74
        y: 0.28
        w: 1.82
        h: 0.8
        size: 9
        color: muted
        align: right
        valign: bottom
        class: eyebrow
        placeholder: Label
      left:
        kind: markdown
        x: 0.44
        y: 1.32
        w: 4.46
        h: 3.95
        size: 14
        color: text
        required: true
      right:
        kind: markdown
        x: 5.1
        y: 1.32
        w: 4.46
        h: 3.95
        size: 14
        color: text
        required: true
  image:
    description: Title, text on the left, a picture on the right
    shapes:
      - kind: rect
        x: 0.54
        y: 1.12
        w: 8.92
        h: 0.012
        fill: line
    slots:
      title:
        kind: text
        x: 0.44
        y: 0.28
        w: 7.3
        h: 0.8
        size: 24
        bold: true
        font: heading
        color: text
        valign: bottom
        placeholder: Title
      eyebrow:
        kind: text
        x: 7.74
        y: 0.28
        w: 1.82
        h: 0.8
        size: 9
        color: muted
        align: right
        valign: bottom
        class: eyebrow
        placeholder: Label
      body:
        kind: markdown
        x: 0.44
        y: 1.32
        w: 4.1
        h: 3.95
        size: 14
        color: text
      image:
        kind: image
        x: 4.74
        y: 1.32
        w: 4.82
        h: 3.95
        required: true
        placeholder: "![caption](assets/picture.png)"
  chart:
    description: Title, a chart, a caption below it
    shapes:
      - kind: rect
        x: 0.54
        y: 1.12
        w: 8.92
        h: 0.012
        fill: line
    slots:
      title:
        kind: text
        x: 0.44
        y: 0.28
        w: 7.3
        h: 0.8
        size: 24
        bold: true
        font: heading
        color: text
        valign: bottom
        placeholder: Title
      eyebrow:
        kind: text
        x: 7.74
        y: 0.28
        w: 1.82
        h: 0.8
        size: 9
        color: muted
        align: right
        valign: bottom
        class: eyebrow
        placeholder: Label
      chart:
        kind: chart
        x: 0.44
        y: 1.32
        w: 9.12
        h: 3.45
        size: 11
        required: true
        placeholder: |-
          ```chart
          kind: column
          categories: [Q1, Q2]
          series:
            - name: Revenue
              values: [120, 180]
          ```
      caption:
        kind: text
        x: 0.44
        y: 4.82
        w: 9.12
        h: 0.45
        size: 10
        color: muted
        placeholder: Source or takeaway
  table:
    description: Title and a table
    shapes:
      - kind: rect
        x: 0.54
        y: 1.12
        w: 8.92
        h: 0.012
        fill: line
    slots:
      title:
        kind: text
        x: 0.44
        y: 0.28
        w: 7.3
        h: 0.8
        size: 24
        bold: true
        font: heading
        color: text
        valign: bottom
        placeholder: Title
      eyebrow:
        kind: text
        x: 7.74
        y: 0.28
        w: 1.82
        h: 0.8
        size: 9
        color: muted
        align: right
        valign: bottom
        class: eyebrow
        placeholder: Label
      table:
        kind: table
        x: 0.44
        y: 1.32
        w: 9.12
        h: 3.95
        size: 13
        color: text
        required: true
        placeholder: |-
          | Item | Value |
          |---|---|
          | Pages | 120 |
  quote:
    description: A quotation and who said it
    background: surface
    shapes:
      - kind: rect
        x: 0.7
        y: 1.45
        w: 0.06
        h: 2.4
        fill: accent
    slots:
      quote:
        kind: text
        x: 1
        y: 1.4
        w: 8.2
        h: 2.1
        size: 28
        italic: true
        font: heading
        color: text
        valign: middle
        required: true
        class: statement
        placeholder: The quote
      attribution:
        kind: text
        x: 1
        y: 3.55
        w: 8.2
        h: 0.5
        size: 13
        color: muted
        placeholder: Who said it
  blank:
    description: The whole canvas as one body (HTML welcome)
    shapes: []
    slots:
      body:
        kind: markdown
        x: 0.44
        y: 0.35
        w: 9.12
        h: 4.95
        size: 15
        color: text
        required: true
snippets:
  - name: Cards
    description: Three cards with a number, a heading and a line
    kind: html
    w: 9.12
    h: 2.2
    content: >-
      <div class="cards">
        <div class="card"><span class="num">01</span><h3>First</h3><p>What it is and why it matters.</p></div>
        <div class="card"><span class="num">02</span><h3>Second</h3><p>What it is and why it matters.</p></div>
        <div class="card"><span class="num">03</span><h3>Third</h3><p>What it is and why it matters.</p></div>
      </div>
  - name: Key figures
    description: Big numbers with a label
    kind: html
    w: 9.12
    h: 1.6
    content: >-
      <div class="kpis">
        <div class="kpi"><strong>120</strong><span>pages migrated</span></div>
        <div class="kpi"><strong>5 min</strong><span>to publish a text</span></div>
        <div class="kpi"><strong>−60%</strong><span>time per text</span></div>
      </div>
  - name: Flow
    description: Boxes from left to right with arrows
    kind: html
    w: 9.12
    h: 1.6
    content: >-
      <div class="flow">
        <div class="box ghost">Sources<small>CSV, Excel</small></div>
        <div class="arrow">→</div>
        <div class="box accent">We build this<small>import, checks, API</small></div>
        <div class="arrow">→</div>
        <div class="box solid">Channels<small>web, newsletter, social</small></div>
      </div>
  - name: Timeline
    description: Points on a line, left to right
    kind: html
    w: 9.12
    h: 1.4
    content: |-
      <ol class="timeline">
        <li><b>December</b><span>Website</span></li>
        <li><b>January</b><span>Newsletter, LinkedIn</span></li>
        <li><b>February</b><span>Review with the same texts</span></li>
      </ol>
  - name: Before / after
    description: Two boxes side by side
    kind: html
    w: 9.12
    h: 2.2
    content: >-
      <div class="compare">
        <div><h3>Today</h3><p>Every text is copied by hand into four tools.</p></div>
        <div><h3>With the change</h3><p>Written once, published everywhere.</p></div>
      </div>
  - name: Columns
    description: Three columns with a small heading
    kind: html
    w: 9.12
    h: 2
    content: |-
      <div class="cols">
        <div><h3>For</h3><p>Who it serves.</p></div>
        <div><h3>Not now</h3><p>What stays out.</p></div>
        <div><h3>Next</h3><p>What follows.</p></div>
      </div>
  - name: Callout
    description: A highlighted note
    kind: html
    w: 6
    h: 1
    content: <div class="callout"><strong>Note:</strong> the one thing to
      remember.</div>
