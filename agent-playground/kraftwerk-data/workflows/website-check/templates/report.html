<!doctype html>
<!--
  SLOT DOCUMENTATION — every {{...}} slot is filled by scripts/render-report.sh
  from audit.json. No LLM touches this file.

  Scalars:
    {{SITE}}           hostname of the audited page
    {{URL_LINE}}       audited URL (+ final URL if redirected)
    {{GENERATED_AT}}   e.g. "2026-08-18 09:12"
    {{STATUS_CLASS}}   ok | warning | critical   (overall verdict)
    {{STATUS_LABEL}}   e.g. "2 issues found"
    {{PASS_VALUE}} {{WARN_VALUE}} {{FAIL_VALUE}}   check counts
    {{HTTP_VALUE}} {{HTTP_SUB}}   final status + redirect count
    {{TIME_VALUE}} {{TIME_SUB}}   total load time + TTFB
    {{SIZE_VALUE}} {{SIZE_SUB}}   document size + content type

  {{FIX_SECTION}} — empty string when all checks pass; otherwise a card with
    the copy-paste fix prompt (pre#fix-prompt + copy button + inline script),
    generated entirely by the render script.

  {{CHECK_CARDS}} — one block per check:
    <section class="card check ok|warning|critical">
      <div class="check-head">
        <span class="badge ok">pass</span>
        <h2>Title Tag</h2>
        <span class="check-sum">58 characters</span>
      </div>
      <ul class="check-details"><li>…</li></ul>
      <pre class="evidence">…</pre>
    </section>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website check — {{SITE}}</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --ring: rgba(11,11,11,0.10);
    --code-bg: #f1f1ec;
    --ok: #0ca30c; --warning: #fab219; --critical: #d03b3b;
    --ok-track: #d3eed3; --warning-track: #fdeecd; --critical-track: #f5d8d8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --ring: rgba(255,255,255,0.10);
      --code-bg: #111110;
      --ok-track: #14350f; --warning-track: #3d3009; --critical-track: #391212;
    }
  }
  :root[data-theme="dark"] {
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --ring: rgba(255,255,255,0.10);
    --code-bg: #111110;
    --ok-track: #14350f; --warning-track: #3d3009; --critical-track: #391212;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 780px; margin: 0 auto; display: grid; gap: 14px; }
  header.report { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; padding: 0 4px; }
  header.report h1 { font-size: 20px; font-weight: 650; overflow-wrap: anywhere; }
  header.report .when { color: var(--muted); font-size: 13px; }
  .url-line { color: var(--ink-2); font-size: 13px; padding: 0 4px; overflow-wrap: anywhere; }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    border: 1px solid var(--ring); border-radius: 999px; padding: 3px 12px;
    background: var(--surface); white-space: nowrap;
  }
  .badge::before { content: ""; width: 9px; height: 9px; border-radius: 50%; }
  .badge.ok::before { background: var(--ok); }
  .badge.warning::before { background: var(--warning); }
  .badge.critical::before { background: var(--critical); }

  .card {
    background: var(--surface); border: 1px solid var(--ring);
    border-radius: 10px; padding: 16px 20px;
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }
  .tile .label { font-size: 13px; color: var(--ink-2); }
  .tile .value { font-size: 28px; font-weight: 600; line-height: 1.25; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 12.5px; color: var(--muted); }
  .tile .value .split { display: inline-flex; align-items: baseline; gap: 10px; }
  .tile .value .n { display: inline-flex; align-items: center; gap: 6px; }
  .tile .value .n::before { content: ""; width: 9px; height: 9px; border-radius: 50%; }
  .tile .value .n.ok::before { background: var(--ok); }
  .tile .value .n.warning::before { background: var(--warning); }
  .tile .value .n.critical::before { background: var(--critical); }

  .check { border-left: 4px solid var(--grid); }
  .check.ok { border-left-color: var(--ok); }
  .check.warning { border-left-color: var(--warning); }
  .check.critical { border-left-color: var(--critical); }
  .check-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .check-head h2 { font-size: 15px; font-weight: 650; }
  .check-head .badge { font-size: 11.5px; padding: 2px 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  .check-head .check-sum { color: var(--ink-2); font-size: 13.5px; margin-left: auto; }
  .check-details { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13.5px; color: var(--ink-2); }
  .check-details li::marker { color: var(--muted); }
  .evidence {
    margin-top: 10px; padding: 10px 12px; border-radius: 7px;
    background: var(--code-bg); border: 1px solid var(--grid);
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink-2); overflow-x: auto; white-space: pre;
  }

  .fix .fix-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .fix .fix-head h2 { font-size: 15px; font-weight: 650; }
  .fix .fix-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .fix button {
    margin-left: auto; cursor: pointer;
    font: 600 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink); background: var(--code-bg);
    border: 1px solid var(--ring); border-radius: 7px; padding: 8px 14px;
  }
  .fix button:hover { border-color: var(--ink-2); }
  .fix button.done { color: var(--ok); border-color: var(--ok); }
  .fix pre {
    margin-top: 12px; padding: 12px 14px; border-radius: 7px;
    background: var(--code-bg); border: 1px solid var(--grid);
    font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink-2); overflow-x: auto; white-space: pre-wrap;
    max-height: 420px; overflow-y: auto;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="report">
    <h1>{{SITE}}</h1>
    <span class="badge {{STATUS_CLASS}}">{{STATUS_LABEL}}</span>
    <span class="when">generated {{GENERATED_AT}}</span>
  </header>
  <div class="url-line">{{URL_LINE}}</div>

  <section class="card">
    <div class="tiles">
      <div class="tile">
        <div class="label">Checks</div>
        <div class="value"><span class="split"><span class="n ok">{{PASS_VALUE}}</span><span class="n warning">{{WARN_VALUE}}</span><span class="n critical">{{FAIL_VALUE}}</span></span></div>
        <div class="sub">pass · warning · fail</div>
      </div>
      <div class="tile"><div class="label">HTTP</div><div class="value">{{HTTP_VALUE}}</div><div class="sub">{{HTTP_SUB}}</div></div>
      <div class="tile"><div class="label">Load time</div><div class="value">{{TIME_VALUE}}</div><div class="sub">{{TIME_SUB}}</div></div>
      <div class="tile"><div class="label">Document</div><div class="value">{{SIZE_VALUE}}</div><div class="sub">{{SIZE_SUB}}</div></div>
    </div>
  </section>

  {{CHECK_CARDS}}

  {{FIX_SECTION}}
</div>
</body>
</html>
