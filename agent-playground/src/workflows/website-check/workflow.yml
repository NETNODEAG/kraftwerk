# yaml-language-server: $schema=../../../node_modules/nn-agent-framework/schema/workflow.schema.json
name: website-check
description: "Website audit: 8 meta checks (title, description, H1, favicon, lang, structure, status, indexability) — fully deterministic scripts, HTML report"

workspace: |
  Files: audit.json (structured check results), audit_summary.txt (one-line
  summary), report.html (rendered HTML report), fix_prompt.txt (copy-paste
  prompt for a coding agent, only when findings exist), body.html / hops.txt /
  robots.txt (raw fetch artifacts).

steps:
  - name: audit
    run: scripts/audit.sh
    gates:
      - file_non_empty: audit.json
      - contains: { file: audit.json, text: '"status_code"', label: check status code }
      - contains: { file: audit.json, text: '"title"', label: check title tag }
      - contains: { file: audit.json, text: '"meta_description"', label: check meta description }
      - contains: { file: audit.json, text: '"h1"', label: check h1 }
      - contains: { file: audit.json, text: '"favicon"', label: check favicon }
      - contains: { file: audit.json, text: '"lang"', label: check language tag }
      - contains: { file: audit.json, text: '"structure"', label: check html structure }
      - contains: { file: audit.json, text: '"indexable"', label: check indexability }

  - name: render report
    run: scripts/render-report.sh
    gates:
      - file_non_empty: report.html
      - contains: { file: report.html, text: "</html>", label: complete document }
      - slots_filled: report.html

  - name: output results
    run: scripts/output.sh
