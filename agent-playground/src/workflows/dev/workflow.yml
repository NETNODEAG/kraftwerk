# yaml-language-server: $schema=../../../node_modules/kraftwerk/schema/workflow.schema.json
name: tagline
description: "Tagline Generator: Website lesen, Marke verstehen, Tagline kueren (YAML)"

workspace: |
  Dateien: brand.md (Markenanalyse), tagline.md (Vorschlaege + gekuerte Tagline).

agents:
  coder:
    name: Coder
    model: opus
    tools: [Read, Write, Edit, WebFetch] # may read the website
    persona: |
      You are an software engineer and very experienced.

  
steps:
  - name: load_context
    agent: coder
    prompt: prompts/load_context.md
    gates:
      - file_non_empty: context.md
      
