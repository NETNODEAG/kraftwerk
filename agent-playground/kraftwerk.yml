# yaml-language-server: $schema=https://raw.githubusercontent.com/NETNODEAG/kraftwerk/main/kraftwerk/schema/kraftwerk.schema.json
# kraftwerk project config — also marks the project root for the CLI.
# All fields optional. Docs: https://github.com/NETNODEAG/kraftwerk
name: "agent-playground" # display name, shown in the inspector header + browser tab
icon: "🤖" # emoji shown as the inspector favicon
workflows: kraftwerk-data/workflows # where workflows live
output: kraftwerk-data/output # where run artifacts land (git-ignored)
knowledge: kraftwerk-data/knowledge # OKF knowledge bundles
agents: kraftwerk-data/agents # agent definitions
skills: kraftwerk-data/skills # workspace skills (shared instruction packages)
port: 1981
vibeables: {}
