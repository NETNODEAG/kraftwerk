name: Publish to npm

# Publishes @netnodeag/kraftwerk when a GitHub release is published,
# or manually via the Actions tab (workflow_dispatch). The version comes
# from kraftwerk/package.json — bump it there before releasing; a re-run
# with an already-published version fails (npm rejects duplicates).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kraftwerk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: kraftwerk/package-lock.json

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The registry needs a while to serve a fresh version — 0.71.0 took over
      # 10 minutes. Ask it directly (no npm cache in between) for up to 30
      # minutes before declaring the publish broken; `npm publish` already
      # succeeded, so a timeout here means "slow", rarely "missing".
      - name: Verify
        timeout-minutes: 35
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 1 60); do
            if curl -sf -H 'cache-control: no-cache' "https://registry.npmjs.org/${name}/${version}" >/dev/null \
              && npm view "${name}@${version}" version --prefer-online >/dev/null 2>&1; then
              echo "${name}@${version} is on the registry"
              exit 0
            fi
            echo "Not visible yet (attempt $i/60), retrying in 30s ..."
            sleep 30
          done
          echo "::error::${name}@${version} not visible on the registry 30 minutes after publish"
          exit 1
