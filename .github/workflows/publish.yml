name: Publish to npm

# Publishes @netnodeag/kraftwerk when a GitHub release is published,
# or manually via the Actions tab (workflow_dispatch). The version comes
# from kraftwerk/package.json — bump it there before releasing; a re-run
# with an already-published version fails (npm rejects duplicates).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kraftwerk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: kraftwerk/package-lock.json

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The registry needs a moment to serve a fresh version — retry before
      # declaring the publish broken.
      - name: Verify
        run: |
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          for i in $(seq 1 10); do
            npm view "$spec" version && exit 0
            echo "Not visible yet (attempt $i/10), retrying in 15s ..."
            sleep 15
          done
          echo "::error::$spec not visible on the registry after publish"
          exit 1
